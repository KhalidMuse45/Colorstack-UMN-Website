name: Wunderbar MVP checks
on:
  pull_request:
    paths: ['wunderbar/**', '.github/workflows/wunderbar-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wunderbar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wunderbar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wunderbar/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wunderbar-browser-results
          path: wunderbar/test-results/
